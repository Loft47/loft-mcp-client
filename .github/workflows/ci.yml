name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The point of the whole job: committing dist/ has exactly one failure
      # mode, which is tagging a release whose output does not match its source.
      - name: dist/ is up to date
        run: git diff --exit-code dist/
